<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teacher's Day | Amardeep Patel Sir</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .cursive { font-family: 'Great Vibes', cursive; }
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glow-text {
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
    }
  </style>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ APNI FIREBASE CONFIGURATION PASTE KAREIN
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.onSnapshot = onSnapshot;
    window.query = query;
    window.orderBy = orderBy;
  </script>
</head>
<body class="p-3 sm:p-6 relative overflow-x-hidden">

  <!-- Header -->
  <header class="max-w-4xl mx-auto text-center mt-6 mb-10">
    <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full uppercase tracking-widest inline-block mb-3">
      🎉 Happy Teacher's Day 🎉
    </span>
    <h1 class="text-4xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-purple-400 glow-text mb-2">
      Amardeep Patel Sir
    </h1>
    <p class="text-lg sm:text-xl text-slate-300 cursive">
      "A truly great teacher is hard to find, difficult to part with, and impossible to forget."
    </p>
  </header>

  <main class="max-w-4xl mx-auto space-y-8">

    <!-- Form -->
    <section class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-pen-nib text-pink-400 mr-2"></i>Post Photo or Wish for Sir</h2>

      <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Your Name *</label>
            <input type="text" id="studentName" required placeholder="e.g. Rahul Sharma" 
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-amber-300 mb-1">Password * (225415)</label>
            <input type="password" id="postPassword" required placeholder="Enter 225415" 
              class="w-full bg-slate-800 border border-amber-500/40 rounded-xl px-4 py-2.5 text-white text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Message / Wish *</label>
          <textarea id="wishMessage" rows="3" required placeholder="Write your wish..." 
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Photo Upload (Optional)</label>
          <input type="file" id="photoInput" accept="image/*" onchange="previewImage(event)" 
            class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:bg-purple-600 file:text-white border-0 cursor-pointer">
          
          <div id="imagePreviewContainer" class="hidden mt-3 relative inline-block">
            <img id="imagePreview" src="" class="h-32 w-auto object-cover rounded-xl border border-pink-500 shadow-md">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg text-sm">
          Post Wish Permanently
        </button>
      </form>
    </section>

    <!-- Wishes Wall -->
    <section>
      <h2 class="text-2xl font-bold text-white mb-6"><i class="fa-solid fa-heart text-pink-500 mr-2"></i>Wishes Wall</h2>
      <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

  </main>

  <footer class="max-w-4xl mx-auto text-center mt-16 pb-8 border-t border-slate-800 pt-6">
    <p class="text-slate-400 text-sm">Designed & Developed by <span class="text-pink-400 font-bold">Vinay</span></p>
  </footer>

  <script>
    let currentCompressedImageBase64 = "";

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxDim = 500;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else { width = Math.round((width * maxDim) / height); height = maxDim; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentCompressedImageBase64 = canvas.toDataURL('image/jpeg', 0.5);
          document.getElementById('imagePreview').src = currentCompressedImageBase64;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handlePostSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const pass = document.getElementById('postPassword').value.trim();
      const wish = document.getElementById('wishMessage').value.trim();

      if (pass !== "225415") {
        alert("Galat Password! (Sahi Password: 225415)");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Posting...";

      try {
        await window.addDoc(window.collection(window.db, "amardeep_sir_wishes"), {
          name: name,
          wish: wish,
          image: currentCompressedImageBase64 || null,
          createdAt: new Date().toISOString()
        });

        alert("Post Successfully Uploaded!");
        document.getElementById('postForm').reset();
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        currentCompressedImageBase64 = "";
      } catch (err) {
        alert("Upload Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Post Wish Permanently";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const checkDb = setInterval(() => {
        if (window.db) {
          clearInterval(checkDb);
          const q = window.query(window.collection(window.db, "amardeep_sir_wishes"));
          window.onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('postsFeed');
            feed.innerHTML = "";
            snapshot.forEach((doc) => {
              const post = doc.data();
              feed.innerHTML += `
                <div class="glass-card rounded-2xl overflow-hidden p-5 shadow-xl">
                  ${post.image ? `<img src="${post.image}" class="w-full h-48 object-cover rounded-xl mb-3">` : ''}
                  <h3 class="font-bold text-amber-300">${post.name}</h3>
                  <p class="text-slate-200 text-sm mt-1">${post.wish}</p>
                </div>
              `;
            });
          });
        }
      }, 500);
    });
  </script>
</body>
</html>
